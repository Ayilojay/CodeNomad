\* resolver_hybrid_live.cfg
\*
\* Finite TLC configuration for the hybrid resolver model (resolver_hybrid.tla).
\*
\* Purpose
\* -------
\* This configuration exercises the *liveness* properties of the hybrid
\* resolution path: a market whose primary price feed has stalled must
\* eventually resolve through the documented fallback path, provided the
\* fairness assumptions below hold and the honest signer set retains a
\* quorum of eligible weight.
\*
\* It complements the safety configuration (resolver_hybrid_safe.cfg) which
\* explores the same finite state space without fairness constraints.
\*
\* Documented assumptions (must remain explicit and stable)
\* ------------------------------------------------------
\*  A1. Weak fairness on the environment's feed-update action
\*      (WF_vars(FeedUpdate)): a stalled feed is a *persistent* condition,
\*      not a transient one. If the feed could recover, liveness would be
\*      trivially satisfied by the primary path and the fallback would not
\*      be exercised.
\*  A2. Weak fairness on proposal submission (WF_vars(SubmitProposal))
\*      and on acceptance (WF_vars(AcceptProposal)) for every honest
\*      signer: honest signers do not starve indefinitely.
\*  A3. Weak fairness on committee rotation (WF_vars(RotateCommittee)):
\*      rotation proposals that are eligible are eventually acted upon.
\*  A4. The honest signer set HonestSigners holds strictly more than the
\*      acceptance threshold of eligible weight at every reachable
\*      committee, so a quorum is always attainable (see QuorumAvailable).
\*  A5. Weighted keys: weights are positive integers; the threshold is
\*      computed over weights, not head-count. The finite model below
\*      keeps weights small so TLC terminates.
\*
\* Deployed-interface / compatibility note
\* ---------------------------------------
\* This file is a *verification artifact only*. It does not change any
\* deployed interface, on-chain parameter, or wire format. It is consumed
\* exclusively by `make formal` (TLC). Any change to the constants below
\* is an intentional change to the verification scope and must be called
\* out in the accompanying changelog entry.
\*
\* Validation
\* ----------
\*   make formal
\*
\* runs TLC against this configuration and checks:
\*   - Safety invariants (see INVARIANTS below) hold in every reachable
\*     state, including states reached during rotation and while a
\*     resolution proposal is pending.
\*   - The liveness property EventuallyResolvedViaFallback holds under
\*     the fairness assumptions A1–A3 and the quorum assumption A4.

CONSTANTS
    \* Finite signer universe. Small enough for exhaustive TLC search,
    \* large enough to model a rotation (old committee -> new committee)
    \* and a pending proposal spanning the rotation boundary.
    Signers = {s1, s2, s3, s4, s5}

    \* Honest signers (assumption A4). The complement {s4, s5} models
    \* Byzantine / offline signers. Honest weight must exceed the
    \* threshold at every reachable committee.
    HonestSigners = {s1, s2, s3}

    \* Weighted keys (assumption A5). Positive integer weights.
    \* Honest weight = 1 + 1 + 1 = 3; total weight = 3 + 1 + 1 = 5.
    Weights = [s1 |-> 1, s2 |-> 1, s3 |-> 1, s4 |-> 1, s5 |-> 1]

    \* Acceptance threshold over *weight* (not head-count).
    \* 3 of 5 weight is required; honest weight (3) meets it exactly,
    \* so the fallback path is live but has no slack. This is the
    \* tightest interesting configuration.
    Threshold = 3

    \* Initial committee. Rotation moves to a committee drawn from
    \* Signers; both committees below are subsets of Signers.
    InitialCommittee = {s1, s2, s3, s4}

    \* Finite bound on resolution rounds explored by TLC. Keeps the
    \* state space finite while still allowing a rotation to occur
    \* between proposal submission and acceptance.
    MaxRounds = 3

    \* The primary feed is modelled as stalled from the start so that
    \* the fallback path is the only route to resolution (assumption A1).
    FeedStalled = TRUE

SPECIFICATION
    Spec

\* Fairness assumptions A1–A3 are encoded inside Spec (see
\* resolver_hybrid.tla: Spec == Init /\ [][Next]_vars /\ Fairness).
\* The configuration below only fixes the finite constants; the
\* fairness conjuncts themselves live in the model so that the same
\* Spec is shared with the safety configuration.

PROPERTIES
    \* Primary liveness obligation for this configuration:
    \* under A1–A4, a stalled-feed market eventually resolves via the
    \* fallback path.
    EventuallyResolvedViaFallback

    \* Supporting liveness: a pending resolution proposal is eventually
    \* either accepted or superseded by a rotation, never left dangling
    \* forever.
    PendingProposalEventuallySettled

    \* Supporting liveness: committee rotation, once proposed by an
    \* eligible signer, eventually completes (assumption A3).
    RotationEventuallyCompletes

INVARIANTS
    \* Safety invariants re-checked here (in addition to the safety
    \* configuration) because liveness checking explores the same
    \* reachable states under fairness; a violation here indicates the
    \* fairness constraints admit an unsafe schedule.
    TypeOK
    \* A resolution is never finalized without a quorum of eligible
    \* weight from the committee in force at acceptance time.
    ResolutionRequiresQuorum
    \* A rotation never shrinks the eligible honest weight below the
    \* threshold (assumption A4 is preserved across rotations).
    QuorumAvailable
    \* At most one resolution proposal is pending at a time.
    AtMostOnePendingProposal
    \* A pending proposal is bound to the committee that accepted it;
    \* rotation does not retroactively change its signer set.
    PendingProposalBoundToCommittee

CONSTRAINT
    \* Finite exploration bound (MaxRounds). This is a *state* constraint
    \* used only to keep TLC terminating; it is not part of the protocol
    \* semantics and does not weaken the liveness claim within the bound.
    RoundBound

\* End of resolver_hybrid_live.cfg