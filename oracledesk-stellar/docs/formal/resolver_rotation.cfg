# =============================================================================
# TLC configuration: SAFETY
# =============================================================================
# Purpose:
#   Exhaustively model-check the SAFETY properties of the extended resolver
#   state model (resolver_rotation.tla) over a small, finite state space.
#   This configuration exercises the interaction of:
#     - committee rotation (proposal + acceptance across epochs),
#     - pending resolution proposals (in-flight proposals that may be
#       superseded or resolved by a rotating committee),
#     - weighted signer keys (finite signer set with small integer weights).
#
#   The constants below are deliberately tiny so that TLC can exhaust the
#   entire reachable state space. The safety invariants checked here are:
#     - TypeOK
#     - NoTwoCommitteesPerEpoch (at most one accepted committee per epoch)
#     - ResolutionSafety (no two conflicting resolutions are finalized)
#     - PendingProposalConsistency (a finalized proposal is not also pending)
#     - WeightedQuorumSoundness (finalization requires weight >= threshold)
#
#   Run with:  make formal
#   (or directly: tlc -config resolver_rotation_safety.cfg resolver_rotation.tla)
# =============================================================================

SPECIFICATION Spec

CONSTANTS
    # Finite set of signers participating in committees.
    Signers = {s1, s2, s3}

    # Finite set of epochs the model may rotate through.
    Epochs = {e1, e2}

    # Finite set of resolution proposals that may be pending or finalized.
    Proposals = {p1, p2}

    # Finite set of committee configurations that may be proposed/accepted.
    Committees = {c1, c2}

    # Per-signer voting weights (small positive integers).
    Weights = [s1 |-> 1, s2 |-> 1, s3 |-> 1]

    # Quorum threshold expressed in total weight units.
    # With three signers of weight 1 each, a threshold of 2 requires a
    # strict majority and keeps the weighted-quorum reasoning non-trivial.
    QuorumThreshold = 2

    # Maximum number of rotation proposals that may be outstanding at once.
    MaxPendingRotations = 1

    # Maximum number of resolution proposals that may be pending at once.
    MaxPendingResolutions = 1

INVARIANTS
    TypeOK
    NoTwoCommitteesPerEpoch
    ResolutionSafety
    PendingProposalConsistency
    WeightedQuorumSoundness

PROPERTIES
    # Safety config does not assert liveness; see the liveness config below.
```

```cfg
# =============================================================================
# TLC configuration: LIVENESS
# =============================================================================
# Purpose:
#   Model-check the LIVENESS properties of the extended resolver state model
#   (resolver_rotation.tla) under explicit HYBRID FALLBACK assumptions.
#
#   The model supports a hybrid mode in which, if the weighted committee
#   cannot reach quorum within an epoch, resolution falls back to a secondary
#   path (e.g. a fallback signer set / unweighted quorum). This configuration
#   makes those fallback assumptions explicit and finite so that TLC can
#   verify the following liveness properties:
#     - EventualResolution: every pending resolution proposal is eventually
#       finalized or superseded (no permanent pending state).
#     - EventualRotationProgress: a rotation proposal is eventually accepted
#       or abandoned; the committee does not stall indefinitely.
#     - HybridFallbackLiveness: under the fallback assumption, resolution
#       still terminates even when the weighted committee cannot reach quorum.
#
#   The fairness assumptions required for these properties are declared in
#   the TLA+ spec (WF_/SF_ on the relevant actions). The constants below are
#   kept small so TLC can exhaust the state space while still exercising the
#   fallback path.
#
#   Run with:  make formal
#   (or directly: tlc -config resolver_rotation_liveness.cfg resolver_rotation.tla)
# =============================================================================

SPECIFICATION Spec

CONSTANTS
    # Finite set of signers participating in committees.
    Signers = {s1, s2, s3}

    # Finite set of epochs the model may rotate through.
    Epochs = {e1, e2}

    # Finite set of resolution proposals that may be pending or finalized.
    Proposals = {p1, p2}

    # Finite set of committee configurations that may be proposed/accepted.
    Committees = {c1, c2}

    # Per-signer voting weights (small positive integers).
    # Weights are chosen so that the weighted committee CANNOT always reach
    # quorum on its own, forcing the hybrid fallback path to be exercised.
    Weights = [s1 |-> 1, s2 |-> 1, s3 |-> 1]

    # Quorum threshold expressed in total weight units.
    # A threshold of 3 requires ALL signers; combined with the fairness
    # assumptions this forces the model to rely on the hybrid fallback when
    # a signer is unavailable, exercising HybridFallbackLiveness.
    QuorumThreshold = 3

    # Maximum number of rotation proposals that may be outstanding at once.
    MaxPendingRotations = 1

    # Maximum number of resolution proposals that may be pending at once.
    MaxPendingResolutions = 1

INVARIANTS
    # Safety invariants are still checked in the liveness config so that the
    # fallback path cannot violate safety while making progress.
    TypeOK
    ResolutionSafety
    WeightedQuorumSoundness

PROPERTIES
    EventualResolution
    EventualRotationProgress
    HybridFallbackLiveness