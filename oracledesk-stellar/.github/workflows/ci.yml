name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      - name: Build WASM artifacts
        run: cargo build --workspace --locked --target wasm32-unknown-unknown --release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error

  budget-tests:
    # Cross-contract resource-budget gate (see budget-tests/README.md).
    # Measures representative and maximum-size end-to-end paths (treasury,
    # resolver, router) against the shipped WASM and fails CI when CPU,
    # memory or ledger I/O exceed the reviewed limits.
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-budget-${{ hashFiles('**/Cargo.lock') }}

      - name: Download shipped WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32-unknown-unknown/release

      - name: Run resource-budget tests
        # --test-threads=1 keeps metering deterministic across test cases.
        run: cargo test -p budget-tests --locked -- --test-threads=1

  release-gate:
    # Independent review gate for contract releases (see RELEASE_CHECKLIST.md).
    # A release tag is only permitted when every checklist item has evidence.
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: artifacts/contract-wasm

      - name: Verify release checklist evidence
        run: |
          set -euo pipefail
          checklist="RELEASE_CHECKLIST.md"
          if [ ! -f "$checklist" ]; then
            echo "::error::Missing $checklist; release tagging is blocked."
            exit 1
          fi

          # Every checklist item must be marked as evidenced with [x].
          # Unchecked items ([ ]) block release tagging.
          missing=0
          while IFS= read -r line; do
            case "$line" in
              "- [ ]"*)
                echo "::error::Unresolved checklist item: ${line#- [ ] }"
                missing=$((missing + 1))
                ;;
            esac
          done < "$checklist"

          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing checklist item(s) lack evidence; release tagging is blocked."
            exit 1
          fi

          # Confirm vendored WASM artifacts are present for the release.
          if ! ls artifacts/contract-wasm/*.wasm >/dev/null 2>&1; then
            echo "::error::No vendored WASM artifacts found; release tagging is blocked."
            exit 1
          fi

          echo "Release checklist satisfied; tagging permitted."
