name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Reads the documented minimum and pinned CI toolchain versions once so the
  # matrix jobs below stay in sync with rust-toolchain.toml / stellar-cli.version
  # / .nvmrc instead of hard-coding them in several places.
  toolchain-versions:
    name: Resolve toolchain versions
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.pinned.outputs.rust }}
      rust_min: ${{ steps.pinned.outputs.rust_min }}
      stellar_cli: ${{ steps.pinned.outputs.stellar_cli }}
      node: ${{ steps.pinned.outputs.node }}
      node_min: ${{ steps.pinned.outputs.node_min }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned and minimum toolchain versions
        id: pinned
        run: |
          echo "rust=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "rust_min=$(tr -d '[:space:]' < rust-minimum-version.txt)" >> "$GITHUB_OUTPUT"
          echo "stellar_cli=$(tr -d '[:space:]' < stellar-cli.version)" >> "$GITHUB_OUTPUT"
          echo "node=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          echo "node_min=$(tr -d '[:space:]' < node-minimum-version.txt)" >> "$GITHUB_OUTPUT"

  # Focused test that asserts the supported/unsupported toolchain combinations
  # and fails loudly (no silent fallback) on unsupported ones. Runs on the
  # pinned release toolchain so the check itself is deterministic.
  toolchain-matrix:
    name: Toolchain matrix (supported/unsupported)
    runs-on: ubuntu-latest
    needs: toolchain-versions
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain-versions.outputs.rust }}
      - name: Assert supported/unsupported toolchain combinations
        env:
          RUST_PINNED: ${{ needs.toolchain-versions.outputs.rust }}
          RUST_MIN: ${{ needs.toolchain-versions.outputs.rust_min }}
          STELLAR_CLI_PINNED: ${{ needs.toolchain-versions.outputs.stellar_cli }}
          NODE_PINNED: ${{ needs.toolchain-versions.outputs.node }}
          NODE_MIN: ${{ needs.toolchain-versions.outputs.node_min }}
        run: ./scripts/ci/assert-toolchain-matrix.sh

  rust:
    name: Rust (fmt, clippy, test, wasm build)
    runs-on: ubuntu-latest
    needs: toolchain-versions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned toolchain versions
        id: pinned
        run: |
          echo "rust=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "stellar_cli=$(tr -d '[:space:]' < stellar-cli.version)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain-versions.outputs.rust }}
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Installed the same way this repo's contributors install it locally
      # (`cargo install stellar-cli` — verified against the actual crate
      # name behind the `stellar` binary, not a guessed GitHub Action).
      - name: Install stellar CLI
        run: cargo install --locked stellar-cli --version ${{ needs.toolchain-versions.outputs.stellar_cli }}

      - name: cargo fmt --check
        run: |
          cargo fmt --check
          cargo fmt --manifest-path scripts/interface-manifest/Cargo.toml --check

      - name: cargo clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          CARGO_TARGET_DIR=target cargo clippy --locked --manifest-path scripts/interface-manifest/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      - name: Build all contracts to wasm
        run: |
          stellar contract build
          ./scripts/sync-vendored-wasm.sh
          stellar contract build

      - name: Fail if vendored wasm or its hash pin drifted from the build
        run: |
          git diff --exit-code -- \
            contracts/resolver/market_core.wasm \
            contracts/treasury/market_core.wasm \
            contracts/resolver/reasoning_registry.wasm \
            contracts/resolver/market_core.wasm.sha256 \
            contracts/treasury/market_core.wasm.sha256 \
            contracts/resolver/reasoning_registry.wasm.sha256

      - name: A stale vendored wasm is a compile error (#58 negative test)
        run: ./scripts/ci/assert-stale-wasm-fails.sh

      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release/*.wasm

  # Builds the workspace on the documented minimum Rust toolchain to prove the
  # minimum is actually supported. Determinism is only asserted on the pinned
  # release toolchain (see reproducible-wasm) since wasm output is not expected
  # to be byte-identical across compiler versions.
  rust-minimum:
    name: Rust minimum (${{ needs.toolchain-versions.outputs.rust_min }})
    runs-on: ubuntu-latest
    needs: toolchain-versions
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain-versions.outputs.rust_min }}
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: cargo test on minimum Rust
        run: cargo test --workspace

  reproducible-wasm:
    name: Reproducible wasm (two clean builds)
    runs-on: ubuntu-latest
    needs: toolchain-versions
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain-versions.outputs.rust }}
          targets: wasm32v1-none

      - name: Install stellar CLI
        run: cargo install --locked stellar-cli --version ${{ needs.toolchain-versions.outputs.stellar_cli }}

      # Builds the workspace twice into separate target directories, compares
      # every wasm byte-for-byte, then checks the vendored copies against a
      # clean build. This is what makes the "vendored wasm drifted" check
      # meaningful: without reproducibility it would fail on noise (#58).
      - name: Prove the build is deterministic
        run: ./scripts/check-wasm-determinism.sh

  python-model:
    name: Python FPMM model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read pinned Python version
        id: pinned
        run: echo "python=$(tr -d '[:space:]' < .python-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pinned.outputs.python }}
      - run: python3 model/fpmm_model.py
      - run: python3 model/fpmm_bounds.py --quick

  node:
    name: Node (x402, agents)
    runs-on: ubuntu-latest
    needs: [rust, toolchain-versions]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned toolchain versions
        id: pinned
        run: |
          echo "rust=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "stellar_cli=$(tr -d '[:space:]' < stellar-cli.version)" >> "$GITHUB_OUTPUT"
          echo "node=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pinned.outputs.node }}
      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pinned.outputs.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --version ${{ steps.pinned.outputs.stellar_cli }}

      - name: Generate bindings from the built wasm
        run: |
          chmod +x scripts/gen-bindings.sh
          ./scripts/gen-bindings.sh

      - name: Check interface compatibility and versions
        env:
          INTERFACE_BASE_REF: origin/${{ github.base_ref || 'develop' }}
        run: make interface-check

      - name: Fail if committed bindings are stale
        run: git diff --exit-code -- packages/bindings

      - name: Install and build bindings packages
        run: |
          for pkg in market-core resolver treasury reasoning-registry timelock router; do
            (cd "packages/bindings/$pkg" && npm ci && npm run build)
          done

      - name: Interface tool tests
        run: CARGO_TARGET_DIR=target cargo test --locked --manifest-path scripts/interface-manifest/Cargo.toml

      - name: x402 — install, typecheck, test
        run: |
          cd x402
          npm ci
          npm run build
          npm test

      - name: agents — install, typecheck, test
        run: |
          cd agents
          npm ci
          npm run build
          npm test

      - name: Fail if lockfiles or manifests drifted during install/build
        run: |
          git diff --exit-code -- \
            Cargo.lock \
            x402/package-lock.json \
            agents/package-lock.json \
            packages/bindings/market-core/package-lock.json \
            packages/bindings/resolver/package-lock.json \
            packages/bindings/treasury/package-lock.json \
            packages/bindings/reasoning-registry/package-lock.json \
            packages/bindings/timelock/package-lock.json \
            packages/bindings/router/package-lock.json

  release-bundle:
    name: Release bundle (checksums, manifests, metadata)
    runs-on: ubuntu-latest
    needs: [rust, node]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned toolchain versions
        id: pinned
        run: |
          echo "rust=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "stellar_cli=$(tr -d '[:space:]' < stellar-cli.version)" >> "$GITHUB_OUTPUT"
          echo "node=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pinned.outputs.rust }}
          targets: wasm32v1-none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pinned.outputs.node }}
      - uses: Swatinem/rust-cache@v2

      - name: Install stellar CLI
        run: cargo install --locked stellar-cli --version ${{ steps.pinned.outputs.stellar_cli }}

      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release

      - name: Generate bindings from the built wasm
        run: |
          chmod +x scripts/gen-bindings.sh
          ./scripts/gen-bindings.sh

      - name: Assemble verifiable release bundle
        run: |
          chmod +x scripts/build-release-bundle.sh
          ./scripts/build-release-bundle.sh

      - name: Verify the bundle against a clean rebuild
        run: |
          chmod +x scripts/verify-release-bundle.sh
          ./scripts/verify-release-bundle.sh dist/release-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/release-bundle

  security:
    name: Security (deps, secrets, artifacts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned toolchain versions
        id: pinned
        run: |
          echo "rust=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
          echo "node=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pinned.outputs.rust }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pinned.outputs.node }}

      # Dependency scanning. `cargo audit` reads the committed Cargo.lock and
      # fails on any advisory not explicitly ignored in .cargo/audit.toml
      # (each ignore there carries a rationale comment).
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit (Rust dependencies)
        run: cargo audit --deny warnings

      - name: npm audit (Node dependencies)
        run: |
          for dir in x402 agents packages/bindings/market-core packages/bindings/resolver \
            packages/bindings/treasury packages/bindings/reasoning-registry \
            packages/bindings/timelock packages/bindings/router; do
            (cd "$dir" && npm audit --audit-level=high)
          done
